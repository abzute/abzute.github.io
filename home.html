<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 jacks Start Page 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>૮ ˶ᵔ ᵕ ᵔ˶ ა Welcome Jack.</h1>
        
        <form class="search-bar" id="search-form">
            <select id="search-engine" class="search-engine-select">
                <option value="google">Google</option>
                <option value="youtube">YouTube</option>
                <option value="reddit">Reddit</option>
            </select>
            <input type="text" id="search-query" placeholder="Search the web... ✨" autofocus autocomplete="off" required>
            <button type="submit">🔎</button>
        </form>

        <div class="bookmarks-header">
            <h2>🌸 My Bookmarks 🌸</h2>
            <button id="add-group-btn" class="btn">+ New Folder</button>
        </div>

        <div id="bookmarks-master-container">
            </div>

        <div class="utilities">
            <div class="widget-card">
                <h3>🕰️ Time</h3>
                <div class="clock-display" id="clock-display">00:00</div>
            </div>

            <div class="widget-card">
                <h3>⏱️ Timer</h3>
                <div class="timer-display" id="timer-display">00:00</div>
                <div class="timer-controls">
                    <button id="timer-toggle">Start</button>
                    <button id="timer-reset">Reset</button>
                </div>
            </div>

            <div class="widget-card notes-card">
                <h3>📝 Quick Notes</h3>
                <textarea id="notepad" placeholder="Jot things down here..."></textarea>
            </div>
        </div>
    </div>
    
    <script>
        /* --- Search Logic --- */
        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = encodeURIComponent(document.getElementById('search-query').value);
            const engine = document.getElementById('search-engine').value;
            let url = '';
            
            if (engine === 'google') url = `https://www.google.com/search?q=${query}`;
            else if (engine === 'youtube') url = `https://www.youtube.com/results?search_query=${query}`;
            else if (engine === 'reddit') url = `https://www.reddit.com/search?q=${query}`;
            
            window.location.href = url;
        });

        /* --- Notepad Logic --- */
        const notepad = document.getElementById('notepad');
        notepad.value = localStorage.getItem('kawaiiNotes') || '';
        notepad.addEventListener('input', () => {
            localStorage.setItem('kawaiiNotes', notepad.value);
        });

        /* --- Clock Logic --- */
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock-display').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* --- Timer Logic (Stopwatch) --- */
        let timerInterval;
        let timerSeconds = 0;
        let isTimerRunning = false;
        const timerDisplay = document.getElementById('timer-display');
        const timerToggleBtn = document.getElementById('timer-toggle');

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        document.getElementById('timer-toggle').addEventListener('click', () => {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                timerToggleBtn.innerText = 'Resume';
            } else {
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    timerDisplay.innerText = formatTime(timerSeconds);
                }, 1000);
                timerToggleBtn.innerText = 'Pause';
            }
            isTimerRunning = !isTimerRunning;
        });

        document.getElementById('timer-reset').addEventListener('click', () => {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 0;
            timerDisplay.innerText = formatTime(timerSeconds);
            timerToggleBtn.innerText = 'Start';
        });

        /* --- Bookmarks Logic --- */
        const masterContainer = document.getElementById('bookmarks-master-container');
        const kawaiiIcons = ['🌸', '🎀', '✨', '💖', '🍓', '🧁', '🧸', '☁️', '🐰', '🌷', '🦋', '🌙'];

        // Load grouped bookmarks or set default
        let groupedBookmarks = JSON.parse(localStorage.getItem('kawaiiGroupedBookmarks'));
        if (!groupedBookmarks || Object.keys(groupedBookmarks).length === 0) {
            groupedBookmarks = {
                "Daily Links": [
                    { name: 'YouTube', url: 'https://youtube.com', icon: '🎀' },
                    { name: 'Reddit', url: 'https://reddit.com', icon: '✨' }
                ],
                "Hobbies": [
                    { name: 'Pinterest', url: 'https://pinterest.com', icon: '💖' }
                ]
            };
        }

        function saveBookmarks() {
            localStorage.setItem('kawaiiGroupedBookmarks', JSON.stringify(groupedBookmarks));
        }

        function renderBookmarks() {
            masterContainer.innerHTML = '';
            
            for (const groupName in groupedBookmarks) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-container';
                
                // Header for the group
                const header = document.createElement('div');
                header.className = 'group-header';
                header.innerHTML = `
                    <div class="group-title">📁 ${groupName}</div>
                    <div class="group-actions">
                        <button onclick="addBookmarkToGroup('${groupName}')">+ Add Link</button>
                        <button onclick="deleteGroup('${groupName}')">🗑️</button>
                    </div>
                `;
                groupDiv.appendChild(header);

                // Grid for the links
                const grid = document.createElement('div');
                grid.className = 'bookmarks-grid';
                
                groupedBookmarks[groupName].forEach((bm, index) => {
                    const card = document.createElement('a');
                    card.className = 'bookmark-card';
                    card.href = bm.url;
                    card.innerHTML = `
                        <div class="bookmark-icon">${bm.icon}</div>
                        <div class="bookmark-name">${bm.name}</div>
                        <button class="delete-btn" onclick="deleteBookmark(event, '${groupName}', ${index})" title="Delete">✖</button>
                    `;
                    grid.appendChild(card);
                });

                groupDiv.appendChild(grid);
                masterContainer.appendChild(groupDiv);
            }
        }

        // Add a new Group
        document.getElementById('add-group-btn').addEventListener('click', () => {
            const groupName = prompt('What is the name of your new folder? 🎀');
            if (!groupName || groupedBookmarks[groupName]) return; 
            groupedBookmarks[groupName] = [];
            saveBookmarks();
            renderBookmarks();
        });

        // Delete a Group
        window.deleteGroup = function(groupName) {
            if (confirm(`Are you sure you want to delete the "${groupName}" folder and all its links? 🥺`)) {
                delete groupedBookmarks[groupName];
                saveBookmarks();
                renderBookmarks();
            }
        }

        // Add bookmark to a specific group
        window.addBookmarkToGroup = function(groupName) {
            const name = prompt('What is the name of your new bookmark? 🎀');
            if (!name) return; 
            
            let url = prompt('What is the URL? ✨\n(e.g., https://example.com)');
            if (!url) return; 
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const randomIcon = kawaiiIcons[Math.floor(Math.random() * kawaiiIcons.length)];
            groupedBookmarks[groupName].push({ name, url, icon: randomIcon });
            
            saveBookmarks();
            renderBookmarks();
        }

        // Delete specific bookmark
        window.deleteBookmark = function(event, groupName, index) {
            event.preventDefault(); 
            if (confirm('Are you sure you want to delete this cute bookmark? 🥺')) {
                groupedBookmarks[groupName].splice(index, 1);
                saveBookmarks();
                renderBookmarks();
            }
        }

        renderBookmarks();
    </script>
</body>
</html>
