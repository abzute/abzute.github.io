<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Jack's Calendar 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <a href="index.html" class="btn" style="position: absolute; top: 20px; left: 20px;">❮ Back</a>
        <h1>૮ ˶ᵔ ᵕ ᵔ˶ ა My Planner</h1>
        <div class="calendar-header-nav">
            <button id="prev-month">❮</button>
            <h2 id="month-year-display">Month Year</h2>
            <button id="next-month">❯</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>
    <script>
        const grid = document.getElementById('calendar-grid');
        const monthYearDisplay = document.getElementById('month-year-display');
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('kawaiiEvents')) || {};
        function saveEvents() { localStorage.setItem('kawaiiEvents', JSON.stringify(events)); }
        function renderCalendar() {
            grid.innerHTML = '';
            const year = currentDate.getFullYear(); const month = currentDate.getMonth(); 
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthYearDisplay.innerText = `🌸 ${monthNames[month]} ${year} 🌸`;
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                const dayHeader = document.createElement('div'); dayHeader.className = 'day-name'; dayHeader.innerText = day; grid.appendChild(dayHeader);
            });
            const firstDayIndex = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < firstDayIndex; i++) { grid.innerHTML += '<div class="calendar-cell empty"></div>'; }
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${year}-${month + 1}-${day}`;
                const cell = document.createElement('div'); cell.className = 'calendar-cell';
                cell.innerHTML = `<div class="cal-date-num">${day}</div>`;
                if (events[dateKey]) {
                    events[dateKey].forEach((evt, index) => {
                        const eventDiv = document.createElement('div'); eventDiv.className = 'cal-event'; eventDiv.innerText = evt;
                        eventDiv.onclick = (e) => { e.stopPropagation(); if(confirm(`Delete event: "${evt}"?`)) { events[dateKey].splice(index, 1); if(events[dateKey].length === 0) delete events[dateKey]; saveEvents(); renderCalendar(); } };
                        cell.appendChild(eventDiv);
                    });
                }
                cell.onclick = () => {
                    const newEvent = prompt(`Add a new event or time for ${monthNames[month]} ${day} ✨`);
                    if (newEvent) { if (!events[dateKey]) events[dateKey] = []; events[dateKey].push(newEvent); saveEvents(); renderCalendar(); }
                };
                grid.appendChild(cell);
            }
        }
        document.getElementById('prev-month').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        document.getElementById('next-month').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
        renderCalendar();
    </script>
</body>
</html>
