<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Kawaii Time 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <a href="index.html" class="btn" style="position: absolute; top: 20px; left: 20px;">❮ Back</a>
        <h1>🕰️ Time Center</h1>

        <div class="time-page-grid">
            <div class="widget-card">
                <h3>✨ Current Time ✨</h3>
                <div class="huge-time" id="big-clock">00:00:00</div>
                <div id="big-date" style="font-size: 1.2em; font-weight: 700; color: var(--text-main);">Monday, Jan 1</div>
            </div>

            <div class="widget-card">
                <h3>⏱️ Stopwatch ✨</h3>
                <div class="huge-time" id="big-timer">00:00</div>
                <div class="timer-controls">
                    <button id="timer-toggle">Start</button>
                    <button id="timer-reset" style="background-color: var(--secondary);">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- Big Clock --- */
        function updateBigClock() {
            const now = new Date();
            let hours = now.getHours(); let minutes = now.getMinutes(); let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('big-clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('big-date').innerText = now.toLocaleDateString(undefined, options);
        }
        setInterval(updateBigClock, 1000); updateBigClock();

        /* --- Big Timer --- */
        let timerInterval, timerSeconds = 0, isTimerRunning = false;
        const timerDisplay = document.getElementById('big-timer');
        const timerToggleBtn = document.getElementById('timer-toggle');

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        timerToggleBtn.addEventListener('click', () => {
            if (isTimerRunning) { clearInterval(timerInterval); timerToggleBtn.innerText = 'Resume'; } 
            else { timerInterval = setInterval(() => { timerSeconds++; timerDisplay.innerText = formatTime(timerSeconds); }, 1000); timerToggleBtn.innerText = 'Pause'; }
            isTimerRunning = !isTimerRunning;
        });
        document.getElementById('timer-reset').addEventListener('click', () => {
            clearInterval(timerInterval); isTimerRunning = false; timerSeconds = 0;
            timerDisplay.innerText = formatTime(timerSeconds); timerToggleBtn.innerText = 'Start';
        });
    </script>
</body>
</html>
